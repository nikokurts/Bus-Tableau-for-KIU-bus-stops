<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Arrival Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>KIU Bus Tableau</h1>
    <p class="subtitle">
        Arrival times are approximate and may vary depending on traffic conditions.
    </p>

    <div class="gallery">
    <img src="image1.jpg" alt="Bus Picture 1">
    <img src="image2.jpeg" alt="Bus Picture 2">
    <img src="image3.jpg" alt="Bus Picture 3">
    </div>

    <div class="section">
        <label for="time">Current Time</label>
        <input
            type="text"
            id="time"
            placeholder="HH:MM"
            pattern="^([01]\d|2[0-3]):([0-5]\d)$"
            maxlength="5"
            required
        >
    </div>

    <div class="section">
        <label for="stop">Bus Stop</label>
        <select id="stop">
            <option value="">Select a bus stop</option>
            <option value="K">Bus stop near K campus</option>
            <option value="Dorms">Bus stop near Dorms</option>
        </select>
    </div>

    <div class="section">
        <button id="showBtn">Show</button>
    </div>

    <div id="output">
        <h2>Arrival Information</h2>
        <p>Arrival information will be displayed here.</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
